name: Chart Defaults Validation
on:
  push:
    branches: [chart-defaults-off-10d-20260916]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-defaults-off-10d-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python chart_defaults_patch.py
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Validate defaults and regressions
        run: |
          python -m py_compile app.py app_core.py decision.py
          node --check static/js/chart.js
          node --check static/js/app.js
          pytest -q tests_chart_defaults_v2.py tests_chart_integrity_v2.py tests_chart_correctness_v2.py tests_chart_performance_v2.py tests_chart_history_10d.py tests_engine.py tests_robust.py tests_daily12.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/chart.js static/js/app.js tests_chart_defaults_v2.py
          git diff --cached --quiet || git commit -m "Default S/R and signals off with 10D range"
          git push
