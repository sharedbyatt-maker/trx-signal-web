name: 12-Step UI Report Validation
on:
  push:
    branches: [upgrade-12step-ui-report-20260906]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply upgrade patch
        run: python upgrade_12step_ui_patch.py
      - name: Install
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py app_core.py decision.py robust_engine.py robust_audit.py robust_integration.py tests_engine.py tests_robust.py tests_deep_audit.py tests_daily12.py tests_feed_resilience.py tests_live_feed_deep.py tests_feed_recovery.py tests_robust_telegram_detail.py tests_12step_ui_detail.py
      - name: JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/chart.js
          node --check static/js/draw.js
          node --check static/js/robust.js
          node --check static/js/daily12.js
      - name: Legacy tests
        run: python tests_engine.py
      - name: Robust tests
        run: python tests_robust.py
      - name: Deep audit tests
        run: python tests_deep_audit.py
      - name: Daily12 tests
        run: python tests_daily12.py
      - name: Feed resilience tests
        run: python tests_feed_resilience.py
      - name: Live feed tests
        run: python tests_live_feed_deep.py
      - name: Feed recovery tests
        run: python tests_feed_recovery.py
      - name: Robust Telegram tests
        run: python tests_robust_telegram_detail.py
      - name: 12-Step UI detail tests
        run: python tests_12step_ui_detail.py
      - name: Commit passing upgrade
        run: |
          git config user.name "sharedbyatt-maker"
          git config user.email "sharedbyatt@gmail.com"
          git add app_core.py templates/index.html static/js/app.js static/js/daily12.js static/css/daily12.css tests_daily12.py tests_12step_ui_detail.py
          git commit -m "Upgrade 12-step signal and daily report detail" || true
          git push origin HEAD:upgrade-12step-ui-report-20260906
