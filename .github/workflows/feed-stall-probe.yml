name: Check deployed TronGrid recovery
on:
  push:
    branches: [diagnostics/feed-stall-20261108]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check recovery asset and authentication gate
        run: |
          set -eu
          site=https://trx-signal-web.onrender.com
          curl --fail --silent --show-error --max-time 25 "$site/static/js/admin.js?v=21" -o admin.js
          grep -q 'recover-trongrid' admin.js
          grep -q '/api/admin/trongrid/recovery' admin.js
          status=$(curl --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' "$site/api/admin/trongrid/recovery")
          test "$status" = 401
          printf 'Recovery UI asset served. Admin recovery endpoint returned %s without a session.\n' "$status"
