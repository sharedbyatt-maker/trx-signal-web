name: Kronos isolated research inference
on:
  workflow_dispatch:
  pull_request:
    paths: ["research/kronos/**", "static/js/kronos.js", "templates/kronos.html", "tests_kronos*", ".github/workflows/kronos-inference.yml"]
  push:
    branches: [main]
    paths: ["research/kronos/**", ".github/workflows/kronos-inference.yml"]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: kronos-publication
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
      KRONOS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify isolated adapters and UI contracts
        run: |
          python tests_kronos_round_adapter.py
          python tests_kronos_automation.py
          node tests_kronos_ui.js
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kronos-mini-v1
      - name: Install isolated CPU dependencies
        run: |
          pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install pandas==2.2.3 numpy==2.3.5 einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm==4.67.1
      - name: Fetch official pinned model code
        run: |
          git clone https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          git -C /tmp/Kronos checkout 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - name: Restore research publication branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/published
          if gh api "repos/$GITHUB_REPOSITORY/branches/kronos-forecasts" >/dev/null 2>&1; then
            git fetch origin kronos-forecasts
            git worktree add /tmp/published-tree FETCH_HEAD
            cp -a /tmp/published-tree/. /tmp/published/
            rm -f /tmp/published/.git
          fi
      - name: Run genuine inference with feed freshness guard
        id: model
        run: python research/kronos/pipeline.py --kronos-dir /tmp/Kronos --history-url 'https://trx-signal-web.onrender.com/api/history?days=30' --output /tmp/published --timeframe 5
      - name: Publish results or failure status without deploying main
        if: always() && github.event_name != 'pull_request' && steps.model.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f /tmp/published/status.json
          cd /tmp/published
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code origin refs/heads/kronos-forecasts; then
            git fetch origin kronos-forecasts
            git reset --soft FETCH_HEAD
          fi
          git add index.json status.json forecasts/ 2>/dev/null || git add status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish immutable Kronos research forecast/status'
          git push origin HEAD:refs/heads/kronos-forecasts
