name: Refactor shared signal decision

on:
  push:
    paths:
      - '.github/workflows/refactor-shared-decision.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = 'from flask import Flask, jsonify, render_template, request\n'
          new = old + 'from decision import decide_signal\n'
          if 'from decision import decide_signal' not in s:
              if old not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(old, new, 1)

          old_bt = '''        a = abs(score)\n        if a >= SCORE_TRADE:\n            pred = 1 if score > 0 else -1\n            buckets["trade"][0] += 1\n            if pred == actual:\n                buckets["trade"][1] += 1\n        elif a >= SCORE_WATCH:\n            buckets["watch"][0] += 1\n'''
          new_bt = '''        # Final decision is intentionally shared with live mode.\n        # m[:i] contains only information known before target round i.\n        mtf = mtf_confluence(m[:i])\n        decision = decide_signal(\n            score, td, m[i - 1], mtf, SCORE_TRADE, SCORE_WATCH)\n        if decision["signal"] in ("BIG", "SMALL"):\n            pred = 1 if decision["signal"] == "BIG" else -1\n            buckets["trade"][0] += 1\n            if pred == actual:\n                buckets["trade"][1] += 1\n        elif decision["signal"] == "SKIP (WATCH)":\n            buckets["watch"][0] += 1\n'''
          if old_bt not in s:
              raise SystemExit('backtest decision block not found')
          s = s.replace(old_bt, new_bt, 1)

          old_live = '''    reason_detail = " | ".join(parts)\n    want = 1 if score > 0 else -1\n    mtf_ok = (out["mtf"]["x5"] in (0, want)) and (out["mtf"]["x15"] in (0, want))\n\n    if abs(score) >= SCORE_TRADE:\n        signal = "BIG" if score > 0 else "SMALL"\n        if trend_diff * m[-1] < -0.004:\n            return {**out, "signal": "SKIP (REVERSAL GUARD)",\n                    "reason": f"⚠️ Trend({side}) ထဲမှာ ဆန့်ကျင်ဘက် ကွဲထွက်နေ၍ ရပ်တန့် | {reason_detail}"}\n        if not mtf_ok and abs(score) < SCORE_TRADE + 15:\n            return {**out, "signal": "SKIP (WATCH)",\n                    "reason": (f"👀 MTF မကိုက် (×5 {'▲' if out['mtf']['x5'] > 0 else '▼'} · "\n                               f"×15 {'▲' if out['mtf']['x15'] > 0 else '▼'}) — Watch | {reason_detail}")}\n        return {**out, "signal": signal,\n                "reason": f"🎯 CONFLUENCE {score:+.0f} | {reason_detail}"}\n\n    if abs(score) >= SCORE_WATCH:\n        return {**out, "signal": "SKIP (WATCH)",\n                "reason": f"👀 Watch Zone ({score:+.0f}) — Confluence မလုံလောက် | {reason_detail}"}\n\n    return {**out, "signal": "SKIP",\n            "reason": f"⏸️ Signal မရှိ ({score:+.0f}) | {reason_detail}"}\n'''
          new_live = '''    reason_detail = " | ".join(parts)\n    decision = decide_signal(\n        score, trend_diff, m[-1], out["mtf"], SCORE_TRADE, SCORE_WATCH)\n\n    if decision["kind"] == "reversal_guard":\n        return {**out, "signal": decision["signal"],\n                "reason": f"⚠️ Trend({side}) ထဲမှာ ဆန့်ကျင်ဘက် ကွဲထွက်နေ၍ ရပ်တန့် | {reason_detail}"}\n    if decision["kind"] == "mtf_guard":\n        return {**out, "signal": decision["signal"],\n                "reason": (f"👀 MTF မကိုက် (×5 {'▲' if out['mtf']['x5'] > 0 else '▼'} · "\n                           f"×15 {'▲' if out['mtf']['x15'] > 0 else '▼'}) — Watch | {reason_detail}")}\n    if decision["kind"] == "trade":\n        return {**out, "signal": decision["signal"],\n                "reason": f"🎯 CONFLUENCE {score:+.0f} | {reason_detail}"}\n    if decision["kind"] == "watch":\n        return {**out, "signal": decision["signal"],\n                "reason": f"👀 Watch Zone ({score:+.0f}) — Confluence မလုံလောက် | {reason_detail}"}\n    return {**out, "signal": decision["signal"],\n            "reason": f"⏸️ Signal မရှိ ({score:+.0f}) | {reason_detail}"}\n'''
          if old_live not in s:
              raise SystemExit('live decision block not found')
          s = s.replace(old_live, new_live, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests_engine.py')
          ts = t.read_text(encoding='utf-8')
          marker = '\n\ndef test_rsi_alert_state():\n'
          test_fn = '''\n\ndef test_shared_decision_policy():\n    # Normal trade\n    d = eng.decide_signal(60, 0.10, 1, {"x5": 1, "x15": 1}, 40, 22)\n    assert d["signal"] == "BIG" and d["kind"] == "trade"\n\n    # Reversal guard must block a score-qualified trade\n    d = eng.decide_signal(60, -0.10, 1, {"x5": 1, "x15": 1}, 40, 22)\n    assert d["signal"] == "SKIP (REVERSAL GUARD)" and d["kind"] == "reversal_guard"\n\n    # MTF disagreement inside +15 buffer must become watch, not trade\n    d = eng.decide_signal(50, 0.10, 1, {"x5": -1, "x15": 1}, 40, 22)\n    assert d["signal"] == "SKIP (WATCH)" and d["kind"] == "mtf_guard"\n\n    # Strong score is allowed through the MTF buffer exactly like live mode\n    d = eng.decide_signal(56, 0.10, 1, {"x5": -1, "x15": -1}, 40, 22)\n    assert d["signal"] == "BIG" and d["kind"] == "trade"\n\n    # Watch and skip zones\n    assert eng.decide_signal(30, 0, 1, {"x5": 0, "x15": 0}, 40, 22)["kind"] == "watch"\n    assert eng.decide_signal(10, 0, 1, {"x5": 0, "x15": 0}, 40, 22)["kind"] == "skip"\n    print("  shared decision ........ OK")\n'''
          if 'def test_shared_decision_policy()' not in ts:
              if marker not in ts:
                  raise SystemExit('test insertion marker not found')
              ts = ts.replace(marker, test_fn + marker, 1)
          call_anchor = '    test_mtf_markov()\n    test_rsi_alert_state()\n'
          if '    test_shared_decision_policy()\n' not in ts:
              if call_anchor not in ts:
                  raise SystemExit('test call anchor not found')
              ts = ts.replace(call_anchor, '    test_mtf_markov()\n    test_shared_decision_policy()\n    test_rsi_alert_state()\n', 1)
          t.write_text(ts, encoding='utf-8')
          PY

      - name: Run engine self-tests
        run: python tests_engine.py

      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tests_engine.py decision.py
          git commit -m 'Use shared decision policy for live and backtest'
          git push
