name: CI and Browser E2E QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run complete Python regression suite
        env:
          TRX_NO_ENGINE: "1"
        run: |
          set -e
          for test_file in tests_*.py; do
            echo "Running $test_file"
            python "$test_file"
          done
      - name: Discover and run Python test functions
        env:
          TRX_NO_ENGINE: "1"
        run: python -m pytest -q tests_*.py
      - name: Verify application import without background engines
        env:
          TRX_NO_ENGINE: "1"
        run: python -c "import app; assert app.app is not None; assert not app.l1_capital_service._thread"
      - name: Check application JavaScript syntax
        run: |
          set -e
          for js_file in static/js/*.js e2e/*.js *.js; do
            if [ -f "$js_file" ]; then node --check "$js_file"; fi
          done
      - name: Verify request timeout and recovery
        run: |
          node tests_transport_stability.js
          node tests_history_bridge.js
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser history sync
        run: npx playwright test e2e/trxchart-sync.spec.js e2e/trxchart-account.spec.js
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report and layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-python-${{ matrix.python-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload compact layout and error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-layouts-python-${{ matrix.python-version }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
