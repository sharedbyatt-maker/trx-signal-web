name: Browser E2E QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Run focused stability regression
        run: pytest -q tests_deep_hardening.py tests_stability_performance_hardening.py tests_chart_latency_v2.py tests_multi_tf_normalization.py tests_engine.py tests_robust.py
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
