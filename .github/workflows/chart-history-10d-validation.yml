name: Chart History 10D Validation
on:
  push:
    branches: [chart-history-10day-fix-20260914]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-history-10day-fix-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply history patch
        run: python chart_history_10d_patch.py
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Syntax checks
        run: |
          python -m py_compile app.py app_core.py decision.py robust_engine.py robust_integration.py robust_audit.py tests_chart_history_10d.py
          node --check static/js/app.js
          node --check static/js/chart.js
      - name: Focused history tests
        run: pytest -q tests_chart_history_10d.py
      - name: Core regression suite
        run: pytest -q tests_engine.py tests_robust.py tests_deep_audit.py tests_daily12.py tests_streak_alert.py tests_sma_indicator.py tests_chart_correctness_v2.py tests_multi_tf_normalization.py tests_chart_performance_v2.py tests_chart_latency_v2.py tests_pattern_engine_v2.py tests_timeframe_v2.py tests_crosshair_sync_v2.py tests_fast_live_indicators_v2.py
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npx playwright test
      - name: Commit passing implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py app_core.py static/js/app.js static/js/chart.js templates/index.html e2e/chart.spec.js tests_chart_history_10d.py
          git diff --cached --quiet || git commit -m "Restore explicit 10-day chart history and range navigation"
          git push
