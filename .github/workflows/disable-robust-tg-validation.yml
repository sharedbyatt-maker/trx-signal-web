name: Disable Robust Telegram Validation
on:
  push:
    branches: [disable-robust-telegram-20260913]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: disable-robust-telegram-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python disable_robust_tg_patch.py
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Syntax
        run: python -m py_compile app.py app_core.py decision.py robust_engine.py robust_integration.py robust_audit.py
      - name: Focused disabled contract
        run: pytest -q tests_robust_telegram_disabled.py
      - name: Core regressions
        run: pytest -q tests_engine.py tests_robust.py tests_deep_audit.py tests_daily12.py tests_streak_alert.py tests_sma_indicator.py
      - name: Commit passing implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robust_integration.py tests_robust_telegram_disabled.py
          git commit -m "Disable Robust Engine Telegram notifications"
          git push
