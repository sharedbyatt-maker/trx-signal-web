name: Deep Audit Fix

on:
  push:
    branches:
      - deep-audit-fix-20260906

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Apply fixes
        run: python deep_audit_patch.py
      - name: Python syntax
        run: python -m compileall -q app.py app_core.py decision.py robust_engine.py robust_audit.py robust_integration.py tests_engine.py tests_robust.py tests_deep_audit.py
      - name: Legacy tests
        run: python tests_engine.py
      - name: Robust tests
        run: python tests_robust.py
      - name: Deep audit tests
        run: python tests_deep_audit.py
      - name: JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/chart.js
          node --check static/js/draw.js
          node --check static/js/robust.js
      - name: Commit passing fixes
        run: |
          rm -f deep_audit_patch.py .github/workflows/deep-audit-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "sharedbyatt-maker"
          git config user.email "sharedbyatt@gmail.com"
          git add -A
          git commit -m "Deep audit: harden runtime and data safety"
          git push origin HEAD:deep-audit-fix-20260906
