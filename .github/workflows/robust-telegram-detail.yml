name: Robust Telegram Detail Validation
on:
  push:
    branches: [robust-telegram-detail-20260906]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile robust_engine.py robust_integration.py tests_robust.py tests_robust_telegram_detail.py
      - name: Legacy tests
        run: python tests_engine.py
      - name: Robust tests
        run: python tests_robust.py
      - name: Deep audit tests
        run: python tests_deep_audit.py
      - name: Telegram detail tests
        run: python tests_robust_telegram_detail.py
