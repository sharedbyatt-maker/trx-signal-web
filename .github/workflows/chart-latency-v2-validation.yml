name: Chart Latency v2 Validation

on:
  push:
    branches: [chart-latency-v2-20260913]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-latency-v2-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply latency patch
        run: python phase15_chart_latency_patch.py
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py app_core.py decision.py robust_engine.py robust_integration.py drawings_persistence.py
      - name: JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/chart.js
          node --check static/js/draw.js
      - name: Regression suite
        run: |
          python tests_engine.py
          python tests_robust.py
          python tests_deep_audit.py
          python tests_daily12.py
          python tests_feed_resilience.py
          python tests_live_feed_deep.py
          python tests_feed_recovery.py
          python tests_12step_ui_detail.py
          python tests_streak_alert.py
          python tests_drawing_v2.py
          python tests_fibonacci_v2.py
          python tests_trendline_v2.py
          python tests_sr_v2.py
          python tests_timeframe_v2.py
          python tests_crosshair_sync_v2.py
          python tests_fast_live_indicators_v2.py
          python tests_drawing_persistence_v2.py
          python tests_chart_correctness_v2.py
          python tests_multi_tf_normalization.py
          python tests_chart_performance_v2.py
          python tests_drawing_persistence_hardening.py
          python tests_pattern_engine_v2.py
          python tests_chart_latency_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Commit passing patch
        run: |
          git config user.name "sharedbyatt-maker"
          git config user.email "sharedbyatt@gmail.com"
          git add app_core.py static/js/app.js static/js/chart.js tests_chart_latency_v2.py
          git commit -m "Optimize live chart latency" || true
          git push origin HEAD:chart-latency-v2-20260913
