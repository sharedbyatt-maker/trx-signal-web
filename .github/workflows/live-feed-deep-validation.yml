name: Live Feed Deep Validation
on:
  push:
    branches: [deep-live-feed-fix-20260906]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply live feed fix
        run: python deep_live_patch.py
      - name: Install
        run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile app.py app_core.py decision.py robust_engine.py robust_audit.py robust_integration.py tests_engine.py tests_robust.py tests_deep_audit.py tests_daily12.py tests_feed_resilience.py tests_live_feed_deep.py
      - name: JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/chart.js
          node --check static/js/draw.js
          node --check static/js/robust.js
          node --check static/js/daily12.js
      - name: Legacy tests
        run: python tests_engine.py
      - name: Robust tests
        run: python tests_robust.py
      - name: Deep audit tests
        run: python tests_deep_audit.py
      - name: Daily12 tests
        run: python tests_daily12.py
      - name: Feed resilience tests
        run: python tests_feed_resilience.py
      - name: Live feed deep tests
        run: python tests_live_feed_deep.py
      - name: Commit passing fix
        run: |
          git config user.name "sharedbyatt-maker"
          git config user.email "sharedbyatt@gmail.com"
          git add app.py static/js/app.js tests_live_feed_deep.py
          git commit -m "Fix stale live feed and candle freeze" || true
          git push
